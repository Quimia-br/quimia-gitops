apiVersion: apps/v1
kind: Deployment
metadata:
  name: quimia-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quimia-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quimia-api
    spec:
      containers:
        - name: quimia-api
          image: quimia-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
